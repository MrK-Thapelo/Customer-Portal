<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Parking Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(79,142,247,0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translate3d(0, 20px, 0); }
            to   { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate3d(0, 6px, 0); }
            to   { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }
        .tabular-nums, .font-mono {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }
    </style>
</head>
<body class="bg-[#0d0f14] text-[#e8eaf0] font-['DM Sans'] min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <div class="max-w-md w-full relative z-10 animate-[fadeUp_0.6s_ease_both]">
        <div class="bg-[#161a22] border border-[#2a3040] rounded-[32px] p-10 shadow-[0_32px_64px_rgba(0,0,0,0.5)]">
            <div class="text-center mb-6">
                <h1 class="font-['Syne'] text-3xl font-extrabold text-white mb-2">Welcome Back</h1>
                <p class="text-[#6b7280] text-sm">Sign in with your credentials or dynamic QR code.</p>
            </div>

            <!-- Mode Switcher Tabs -->
            <div class="flex p-1 bg-[#0d0f14] border border-[#2a3040] rounded-2xl mb-6">
                <button type="button" id="tabPasswordMode" onclick="switchLoginMode('password')" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-[#1f2430] text-white shadow transition flex items-center justify-center gap-2">
                    <i class="fas fa-key text-[#4f8ef7]"></i>
                    <span>Password</span>
                </button>
                <button type="button" id="tabQrMode" onclick="switchLoginMode('qr')" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-gray-400 hover:text-white transition flex items-center justify-center gap-2">
                    <i class="fas fa-qrcode text-emerald-400"></i>
                    <span>Scan QR Code</span>
                </button>
            </div>

            <!-- Dynamic QR Code Login Container (Initially Hidden) -->
            <div id="qrLoginContainer" class="hidden text-center space-y-4">
                <p class="text-xs text-gray-400">Scan this single-use dynamic code with your mobile camera or app to sign in instantly.</p>
                
                <div class="relative inline-block mx-auto bg-white p-3.5 rounded-2xl shadow-xl">
                    <!-- QR Image Placeholder / Loaded Target -->
                    <div id="qrImageWrapper" class="w-48 h-48 aspect-square bg-gray-50 rounded-xl flex items-center justify-center relative overflow-hidden">
                        <div id="qrLoadingSpinner" class="w-10 h-10 border-4 border-[#4f8ef7] border-t-transparent rounded-full animate-spin"></div>
                        <img id="loginQrImage" src="" alt="Dynamic Login QR" class="w-48 h-48 hidden object-contain transition-opacity duration-300">
                        
                        <!-- Expired Overlay -->
                        <div id="qrExpiredOverlay" class="hidden absolute inset-0 bg-black/85 backdrop-blur-sm rounded-xl flex flex-col items-center justify-center p-3 text-center">
                            <i class="fas fa-history text-amber-400 text-2xl mb-1.5"></i>
                            <span class="text-xs font-bold text-white mb-2">QR Code Expired</span>
                            <button type="button" onclick="loadLoginQrCode()" class="px-3 py-1.5 bg-[#4f8ef7] text-white text-xs font-bold rounded-lg hover:opacity-90 transition">
                                <i class="fas fa-redo mr-1"></i>Refresh
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Timer & Pulse Indicator -->
                <div class="flex items-center justify-center space-x-3 text-xs">
                    <span class="inline-flex items-center gap-1.5 text-gray-400">
                        <span id="qrPulseDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span id="qrStatusText">Waiting for scan...</span>
                    </span>
                    <span class="text-gray-600">|</span>
                    <span id="qrCountdown" class="font-mono font-bold text-amber-400">02:00</span>
                </div>

                <!-- Interactive Simulation / Test Button -->
                <div class="pt-2">
                    <button type="button" onclick="simulateMobileQrScan()" id="simulateScanBtn" class="w-full py-2.5 px-4 rounded-xl text-xs font-semibold bg-[#1f2430] border border-[#2a3040] hover:border-emerald-500 text-emerald-400 transition flex items-center justify-center gap-2 shadow">
                        <i class="fas fa-mobile-alt"></i>
                        <span>Simulate Mobile Scan & Approve</span>
                    </button>
                </div>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="identifier" class="block text-xs font-bold uppercase tracking-wider text-[#6b7280] mb-2">Mobile Number, Car Registration, or Email</label>
                    <input type="text" id="identifier" name="identifier" autocomplete="username" autofocus class="w-full bg-[#0d0f14] border border-[#2a3040] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#4f8ef7] focus:ring-2 focus:ring-[#4f8ef7]/20 transition-all placeholder:text-gray-600 text-sm" placeholder="e.g., 0712345678, ABC123GP, or user@email.com" required>
                </div>
                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-[#6b7280] mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" autocomplete="current-password" class="w-full bg-[#0d0f14] border border-[#2a3040] rounded-xl pl-4 pr-12 py-3 text-white focus:outline-none focus:border-[#4f8ef7] focus:ring-2 focus:ring-[#4f8ef7]/20 transition-all placeholder:text-gray-600 text-sm" placeholder="••••••••" required>
                        <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" aria-label="Toggle password visibility" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition p-1.5 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#4f8ef7]">
                            <i id="passwordToggleIcon" class="fas fa-eye text-sm"></i>
                        </button>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="text-xs text-gray-500">Need help?</span>
                        <a href="forgot-password.html" class="text-xs font-semibold text-[#4f8ef7] hover:text-[#7c3aed] transition-colors">
                            Forgot Password?
                        </a>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-[#4f8ef7] to-[#7c3aed] text-white py-3.5 rounded-xl font-bold font-['Syne'] hover:opacity-95 active:scale-[0.98] transition-all shadow-[0_8px_20px_rgba(79,142,247,0.3)] flex items-center justify-center gap-2 cursor-pointer">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>

            <p class="text-center text-sm text-[#6b7280] mt-8">
                Don't have an account? <a href="register.html" class="text-[#4f8ef7] font-bold hover:underline">Register here</a>
            </p>
            <div id="message" class="mt-4 text-center text-sm font-medium min-h-[1.25rem] hidden"></div>
        </div>
    </div>
    
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
    <script src="toast.js"></script>
    <script src="login.js"></script>
</body>
</html>
