<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Parking Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body::before {
            content: '';
            position: fixed; top: -30%; left: -20%; width: 60%; height: 60%;
            background: radial-gradient(ellipse, rgba(79,142,247,0.12) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
    </style>
</head>
<body class="bg-[#0d0f14] text-[#e8eaf0] font-['DM Sans'] min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <div class="max-w-md w-full relative z-10">
        <div class="bg-[#161a22] border border-[#2a3040] rounded-[32px] p-10 shadow-2xl text-center">
            <h1 class="font-['Syne'] text-3xl font-extrabold text-white mb-4">Reset Password</h1>
            <p id="stepDescription" class="text-[#6b7280] text-sm mb-8">Enter your registered mobile number or email to receive a verification code.</p>
            
            <form id="forgotForm" class="space-y-6">
                <div class="text-left">
                    <label class="block text-xs font-bold uppercase text-[#6b7280] mb-2">Mobile or Email</label>
                    <input type="text" id="identifier" class="w-full bg-[#0d0f14] border border-[#2a3040] rounded-xl px-4 py-3 text-white focus:border-[#4f8ef7] outline-none transition-all" placeholder="e.g. 0712345678" required>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-[#4f8ef7] to-[#7c3aed] text-white py-4 rounded-xl font-bold font-['Syne'] hover:opacity-90 shadow-lg">
                    Request Verification Code
                </button>
            </form>

            <form id="otpForm" class="hidden space-y-6">
                <div class="text-left">
                    <label class="block text-xs font-bold uppercase text-[#6b7280] mb-2">Verification Code</label>
                    <input type="text" id="otp" class="w-full bg-[#0d0f14] border border-[#2a3040] rounded-xl px-4 py-3 text-white focus:border-[#4f8ef7] outline-none tracking-[0.5em] text-center font-mono text-xl" placeholder="0000" maxlength="4" required>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-[#4f8ef7] to-[#7c3aed] text-white py-4 rounded-xl font-bold font-['Syne'] hover:opacity-90 shadow-lg">
                    Verify Code
                </button>
                <button type="button" onclick="resetFlow()" class="text-xs text-[#6b7280] hover:text-white underline">Change email or mobile</button>
            </form>

            <p class="mt-8 text-sm text-[#6b7280]">Remembered it? <a href="login.html" class="text-[#4f8ef7] font-bold">Back to Login</a></p>
            <div id="message" class="mt-4 text-sm font-medium"></div>
        </div>
    </div>
    <script>
        let currentIdentifier = '';

        function resetFlow() {
            document.getElementById('forgotForm').classList.remove('hidden');
            document.getElementById('otpForm').classList.add('hidden');
            document.getElementById('stepDescription').innerText = "Enter your registered mobile number or email to receive a verification code.";
            document.getElementById('message').innerText = "";
        }

        document.getElementById('forgotForm').onsubmit = async (e) => {
            e.preventDefault();
            currentIdentifier = document.getElementById('identifier').value;
            const msg = document.getElementById('message');
            msg.className = "mt-4 text-sm font-medium text-blue-400";
            msg.innerText = "Processing...";

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentIdentifier })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.innerText = "";
                    document.getElementById('forgotForm').classList.add('hidden');
                    document.getElementById('otpForm').classList.remove('hidden');
                    document.getElementById('stepDescription').innerText = "Please check your email and enter the 4-digit code provided.";
                } else {
                    msg.className = "mt-4 text-sm font-medium text-red-400";
                    msg.innerText = data.message || data.error;
                }
            } catch (err) { msg.innerText = "An error occurred."; }
        };

        document.getElementById('otpForm').onsubmit = async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            const msg = document.getElementById('message');
            msg.className = "mt-4 text-sm font-medium text-blue-400";
            msg.innerText = "Verifying...";

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentIdentifier, code: otp })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.className = "mt-4 text-sm font-medium text-green-400";
                    msg.innerText = data.message + " Redirecting to reset page...";
                    // Redirect to the reset password page with email and code in the URL
                    setTimeout(() => window.location.href = `reset-password.html?email=${encodeURIComponent(currentIdentifier)}&code=${encodeURIComponent(otp)}`, 1500);
                } else {
                    msg.className = "mt-4 text-sm font-medium text-red-400";
                    msg.innerText = data.message || data.error;
                }
            } catch (err) { msg.innerText = "An error occurred."; }
        };
    </script>
    <script src="toast.js"></script>
</body>
</html>
