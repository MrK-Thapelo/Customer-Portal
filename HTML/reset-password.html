<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI Parking Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body::before {
            content: '';
            position: fixed; top: -30%; left: -20%; width: 60%; height: 60%;
            background: radial-gradient(ellipse, rgba(79,142,247,0.12) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
    </style>
</head>
<body class="bg-[#0d0f14] text-[#e8eaf0] font-['DM Sans'] min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <div class="max-w-md w-full relative z-10">
        <div class="bg-[#161a22] border border-[#2a3040] rounded-[32px] p-10 shadow-2xl text-center">
            <h1 class="font-['Syne'] text-3xl font-extrabold text-white mb-4">Set New Password</h1>
            <p class="text-[#6b7280] text-sm mb-8">Please enter your new password below.</p>
            
            <form id="resetForm" class="space-y-6">
                <div class="text-left">
                    <label for="newPassword" class="block text-xs font-bold uppercase text-[#6b7280] mb-2">New Password</label>
                    <input type="password" id="newPassword" class="w-full bg-[#0d0f14] border border-[#2a3040] rounded-xl px-4 py-3 text-white focus:border-[#4f8ef7] outline-none transition-all" placeholder="••••••••" required minlength="8">
                </div>
                <div class="text-left">
                    <label for="confirmPassword" class="block text-xs font-bold uppercase text-[#6b7280] mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="w-full bg-[#0d0f14] border border-[#2a3040] rounded-xl px-4 py-3 text-white focus:border-[#4f8ef7] outline-none transition-all" placeholder="••••••••" required minlength="8">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-[#4f8ef7] to-[#7c3aed] text-white py-4 rounded-xl font-bold font-['Syne'] hover:opacity-90 shadow-lg">
                    Reset Password
                </button>
            </form>
            <div id="message" class="mt-4 text-sm font-medium"></div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(globalThis.location.search);
        const email = urlParams.get('email');
        const code = urlParams.get('code');

        if (!email || !code) {
            document.getElementById('message').innerText = "Invalid access. Missing email or verification code.";
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').onsubmit = async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('message');

            if (newPassword !== confirmPassword) {
                msg.innerText = "Passwords do not match.";
                msg.className = "mt-4 text-sm font-medium text-red-400";
                return;
            }

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, new_password: newPassword })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.className = "mt-4 text-sm font-medium text-green-400";
                    msg.innerText = data.message + " Redirecting to login...";
                    setTimeout(() => globalThis.location.href = 'login.html', 3000);
                } else {
                    msg.className = "mt-4 text-sm font-medium text-red-400";
                    msg.innerText = data.message || data.error;
                }
            } catch (err) { 
                console.error(err);
                msg.className = "mt-4 text-sm font-medium text-red-400";
                msg.innerText = "An error occurred."; 
            }
        };
    </script>
    <script src="toast.js"></script>
</body>
</html>
